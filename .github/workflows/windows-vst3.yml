name: SONARA Windows x64 VST3
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonara-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE project
        run: cmake -S . -B build-win64 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build Release and tests
        run: cmake --build build-win64 --config Release --parallel
      - name: Run regression tests
        run: ctest --test-dir build-win64 -C Release --output-on-failure
      - name: Package verified VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build-win64 -Recurse -Directory -Filter "SONARA.vst3" | Select-Object -First 1
          if (-not $vst) { throw "SONARA.vst3 not found" }
          New-Item -ItemType Directory -Force -Path DIST | Out-Null
          Copy-Item -Recurse -Force $vst.FullName "DIST/SONARA.vst3"
          Compress-Archive -Path "DIST/SONARA.vst3" -DestinationPath "DIST/SONARA-Windows-x64-VST3.zip" -Force
          "commit=${{ github.sha }}" | Set-Content DIST/BUILD_LOG.txt
          "runner=$env:RUNNER_OS" | Add-Content DIST/BUILD_LOG.txt
          "tests=passed" | Add-Content DIST/BUILD_LOG.txt
      - name: Upload SONARA Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SONARA-Windows-x64-VST3
          path: |
            DIST/SONARA-Windows-x64-VST3.zip
            DIST/BUILD_LOG.txt
          if-no-files-found: error
          retention-days: 14