name: Build SongForge AI APK
on:
  workflow_dispatch:
  push:
    branches: [ "ai-song-generator-app" ]
    paths:
      - "SongForgeAI/**"
      - ".github/workflows/songforge-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: SongForgeAI
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SongForge-AI-debug
          path: SongForgeAI/app/build/outputs/apk/debug/app-debug.apk
